<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Where is Goose's home?</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body id="screen-select-page">
    <div id="app" class="modal">
        <div class="modal-header">
            <h1>Where is Goose's home?</h1>
        </div>
        <div class="flex">
            <p class="flex-center">
                🏠<br />
                Move this window to the screen<br />
                where you want the Goose to live,<br />
                then click "Confirm"
            </p>
        </div>
        <div class="modal-footer">
            <button
                id="save"
            >Confirm</button>
        </div>
    </div>
    <script src="./screen_select.js"></script>
</body>
</html>
